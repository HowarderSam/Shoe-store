{% extends 'base.html' %}

{% block title %}Shoes{% endblock %}

{% block content %}
<h1> All products</h1>
<p>Online shoe store</p>



<div class="row">
  {% for i in products %}
  <div class="col-4 mb-3 mb-sm-0">
    <div class="card">
        <img src="{{i.image}}" height="230">
      <div class="card-body">
        <h5 class="card-title">{{i.name}}</h5>
        <p class="card-text">{{i.description}}</p>
        <p class ="card-text">Price: {{i.price}}</p>
        <a href="{{url_for('buy_product', id=i.id)}}" class="btn btn-primary">Buy</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>


{% endblock %}
